# ==============================================================================
# SonarQube / SonarCloud Project Configuration
# ==============================================================================

# Project Identification
sonar.projectKey=notes-app-cohort-9
sonar.projectName=Notes App
sonar.projectVersion=1.0.0

# Source Code Paths
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__
sonar.sourceEncoding=UTF-8

# Test & Coverage Inclusions / Exclusions
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.ts,**/*.spec.tsx
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/__mocks__/**,**/*.config.js,**/*.config.ts,**/*.config.cjs
sonar.coverage.exclusions=**/*.test.js,**/*.test.ts,**/*.test.tsx,**/tests/**,**/__tests__/**,**/config/**

# Language specific settings
sonar.nodejs.executable=node
